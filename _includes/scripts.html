<script type="module" src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}

{% include comments-providers/scripts.html %}

<div id="scroll-progress" aria-hidden="true"></div>
<button id="back-to-top" type="button" aria-label="Back to top">&uarr;</button>

<script>
  (function() {
    // Back-to-top button visibility + click handler
    var btn = document.getElementById('back-to-top');
    var bar = document.getElementById('scroll-progress');

    function update() {
      var y = window.scrollY || window.pageYOffset;
      if (btn) {
        if (y > 400) btn.classList.add('visible');
        else btn.classList.remove('visible');
      }
      if (bar) {
        var max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        var pct = Math.min(100, (y / max) * 100);
        bar.style.width = pct + '%';
      }
    }
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update, { passive: true });
    update();

    if (btn) {
      btn.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  })();
</script>
